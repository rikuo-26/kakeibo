<h1>月別集計（年間）</h1>

<!-- メニュー -->
<a href="index.html">入力ページへ戻る</a>
<hr>

<div id="monthly-summary"></div>

<script>
  // 保存されている支出データを読み込む
  let records = JSON.parse(localStorage.getItem("records") || "[]");

  function renderMonthlySummary() {
    let monthly = Array(12).fill(0);

    records.forEach(r => {
      const month = new Date(r.date).getMonth(); // 0〜11
      monthly[month] += r.amount;
    });

    let html = "<table border='1' cellpadding='5'><tr><th>月</th><th>支出</th></tr>";

for (let i = 0; i < 12; i++) {
  html += `<tr><td>${i + 1}月</td><td>${monthly[i]} 円</td></tr>`;
}

html += "</table>";

    document.getElementById("monthly-summary").innerHTML = html;
  }

  renderMonthlySummary();
</script>

</body>
</html>
