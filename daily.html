
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日別集計｜ふたりの暮らし</title>
  <style>
    :root {
      --green: #557b63;
      --dark: #355640;
      --light: #e6eee5;
      --ivory: #faf8f0;
      --white: #fff;
      --text: #34443a;
      --muted: #748176;
      --border: #dce4d9;
      --red: #a45f48;
    }

    * { box-sizing: border-box; }

    body {
body {
  margin: 0;
  padding: 20px 20px 105px;
      background: var(--ivory);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", sans-serif;
    }

    main { max-width: 1000px; margin: 0 auto; }

    header { margin-bottom: 22px; }

    h1 {
      margin: 0 0 8px;
      color: var(--dark);
      font-size: 27px;
    }

    h2 { margin: 0 0 14px; font-size: 18px; }

    .subtitle { color: var(--muted); font-size: 13px; }

   /* 画面下部に固定する共通メニュー */
.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1000;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 0;
  margin: 0;
  padding: 9px 6px calc(9px + env(safe-area-inset-bottom));
  background: var(--white);
  border-top: 1px solid var(--border);
  box-shadow: 0 -3px 14px #354b3510;
}

.bottom-nav a {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 0;
  padding: 4px 0;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  text-decoration: none;
  font-size: 11px;
  line-height: 1.4;
}

.bottom-nav a .nav-icon {
  font-size: 20px;
}

.bottom-nav a.active {
  color: var(--dark);
  font-weight: bold;
}

.bottom-nav a.active .nav-icon {
  background: var(--light);
  border-radius: 12px;
  padding: 2px 12px;
}

    .panel {
      margin-bottom: 18px;
      padding: 20px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .month-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    button {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--light);
      color: var(--dark);
      cursor: pointer;
      font-size: 14px;
    }

    #month-label { font-weight: 700; font-size: 21px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .stat {
      padding: 15px;
      background: var(--ivory);
      border-radius: 12px;
      min-width: 0;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: clamp(17px, 3vw, 23px);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .weekday {
      text-align: center;
      padding: 8px 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .day {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 7px;
      min-width: 0;
      min-height: 83px;
      padding: 8px 2px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--white);
      color: var(--text);
    }

    .day:disabled {
      background: transparent;
      border-color: transparent;
      cursor: default;
    }

    .day.has-expense { background: var(--light); }

    .day.selected {
      border: 2px solid var(--green);
      background: #d5e5d5;
    }

    .day-number { font-weight: 700; }

    .day-amount {
      font-size: 11px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .day.has-expense .day-amount {
      color: var(--dark);
      font-weight: 700;
    }

    .empty {
      padding: 18px 10px;
      text-align: center;
      color: var(--muted);
      background: var(--ivory);
      border-radius: 10px;
    }

    .record {
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .record:last-child { border-bottom: 0; }

    .record-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .record-name { font-weight: 700; overflow-wrap: anywhere; }
    .record-amount { font-weight: 700; color: var(--red); white-space: nowrap; }
    .record-meta { color: var(--muted); font-size: 13px; margin-top: 5px; }
    .record-memo { margin-top: 5px; font-size: 13px; overflow-wrap: anywhere; }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: var(--light);
      color: var(--dark);
      font-size: 14px;
    }

    .error { background: #f9e8e4; color: #8a3024; }

    @media (max-width: 600px) {
     body { padding: 12px 12px 105px; }
      .panel { padding: 13px; }
      .stats { grid-template-columns: 1fr; }
      .day { min-height: 66px; gap: 5px; }
      .day-amount { font-size: 10px; }
      .month-picker { gap: 6px; }
      .month-picker button { padding: 9px 8px; font-size: 12px; }
      #month-label { font-size: 18px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>ふたりの暮らし 🌿</h1>
    <div class="subtitle">カレンダーから毎日の支出を確認</div>
  </header>

 <nav class="bottom-nav" aria-label="メインメニュー">
  <a href="index.html">
    <span class="nav-icon">✚</span>
    <span>入力</span>
  </a>
  <a href="monthly.html">
    <span class="nav-icon">▦</span>
    <span>月別</span>
  </a>
  <a href="weekly.html">
    <span class="nav-icon">▤</span>
    <span>週次</span>
  </a>
  <a href="daily.html" class="active" aria-current="page">
    <span class="nav-icon">▣</span>
    <span>日別</span>
  </a>
  <a href="settings.html">
    <span class="nav-icon">⚙</span>
    <span>設定</span>
  </a>
</nav>

  <div id="status" class="status">ログイン状態を確認しています…</div>

  <section id="app" hidden>
    <div class="panel">
      <div class="month-picker">
        <button id="prev-month" type="button">← 前の月</button>
        <div id="month-label"></div>
        <button id="next-month" type="button">次の月 →</button>
      </div>
    </div>

    <div class="panel">
      <h2>月の統計</h2>
      <div class="stats">
        <div class="stat">
          <div class="stat-label">月間支出</div>
          <div class="stat-value" id="month-total">0 円</div>
        </div>
        <div class="stat">
          <div class="stat-label">支出があった日数</div>
          <div class="stat-value" id="active-days">0 日</div>
        </div>
        <div class="stat">
          <div class="stat-label">支出があった日の平均</div>
          <div class="stat-value" id="average-total">0 円</div>
        </div>
      </div>
      <p class="subtitle">カレンダーの日付を押すと、その日の支出を確認できます。</p>
    </div>

    <div class="panel">
      <h2>カレンダー</h2>
      <div id="calendar" class="calendar"></div>
    </div>

    <div class="panel">
      <h2 id="selected-heading">選択した日の支出</h2>
      <div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px;">
        <div class="stat">
          <div class="stat-label">支出合計</div>
          <div class="stat-value" id="day-total">0 円</div>
        </div>
        <div class="stat">
          <div class="stat-label">支出件数</div>
          <div class="stat-value" id="day-count">0 件</div>
        </div>
      </div>
      <div id="day-records"></div>
    </div>
  </section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCm2ZekCOLi-JceUCcdDW5FyCdtSwh_ZJU",
    authDomain: "kakeibo-94245.firebaseapp.com",
    projectId: "kakeibo-94245",
    storageBucket: "kakeibo-94245.firebasestorage.app",
    messagingSenderId: "543784840442",
    appId: "1:543784840442:web:ff3fc3d96d417590952d43"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const db = getFirestore(firebaseApp);

  const statusBox = document.getElementById("status");
  const appSection = document.getElementById("app");

  let records = [];
  const today = new Date();
  let selectedMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  let selectedDay = dateKey(today);

  function dateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function yen(value) {
    return Math.round(value).toLocaleString("ja-JP") + " 円";
  }

  function safeText(value) {
    return String(value ?? "");
  }

  function totalFor(list) {
    return list.reduce((sum, record) => {
      const amount = Number(record.amount);
      return sum + (Number.isFinite(amount) ? amount : 0);
    }, 0);
  }

  function recordsForDay(key) {
    return records.filter(record => record.date === key);
  }

  function recordsForMonth() {
    const prefix =
      `${selectedMonth.getFullYear()}-${String(selectedMonth.getMonth() + 1).padStart(2, "0")}`;
    return records.filter(record =>
      typeof record.date === "string" && record.date.startsWith(prefix)
    );
  }

  function renderStats() {
    const monthRecords = recordsForMonth();
    const total = totalFor(monthRecords);
    const activeDays = new Set(
      monthRecords
        .filter(record => Number(record.amount) > 0)
        .map(record => record.date)
    ).size;

    document.getElementById("month-total").textContent = yen(total);
    document.getElementById("active-days").textContent = `${activeDays} 日`;
    document.getElementById("average-total").textContent =
      yen(activeDays ? total / activeDays : 0);
  }

  function renderCalendar() {
    const year = selectedMonth.getFullYear();
    const month = selectedMonth.getMonth();
    const firstWeekday = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const monthRecords = recordsForMonth();

    const totals = {};
    monthRecords.forEach(record => {
      const amount = Number(record.amount);
      if (!Number.isFinite(amount)) return;
      totals[record.date] = (totals[record.date] || 0) + amount;
    });

    document.getElementById("month-label").textContent =
      `${year}年 ${month + 1}月`;

    const calendar = document.getElementById("calendar");
    calendar.innerHTML = "";

    ["日", "月", "火", "水", "木", "金", "土"].forEach(day => {
      const label = document.createElement("div");
      label.className = "weekday";
      label.textContent = day;
      calendar.appendChild(label);
    });

    for (let i = 0; i < firstWeekday; i++) {
      const blank = document.createElement("div");
      calendar.appendChild(blank);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const date = new Date(year, month, day);
      const key = dateKey(date);
      const total = totals[key] || 0;
      const button = document.createElement("button");

      button.type = "button";
      button.className = "day";
      if (total > 0) button.classList.add("has-expense");
      if (key === selectedDay) button.classList.add("selected");

      const number = document.createElement("span");
      number.className = "day-number";
      number.textContent = day;
      button.appendChild(number);

      const amount = document.createElement("span");
      amount.className = "day-amount";
      amount.textContent = total > 0
        ? `${Math.round(total).toLocaleString("ja-JP")}円`
        : "—";
      button.appendChild(amount);

      button.setAttribute("aria-label",
        `${year}年${month + 1}月${day}日、支出${yen(total)}`);

      button.addEventListener("click", () => {
        selectedDay = key;
        renderCalendar();
        renderSelectedDay();
      });

      calendar.appendChild(button);
    }
  }

  function renderSelectedDay() {
    const date = new Date(`${selectedDay}T12:00:00`);
    const list = recordsForDay(selectedDay);
    const total = totalFor(list);

    document.getElementById("selected-heading").textContent =
      `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日の支出`;
    document.getElementById("day-total").textContent = yen(total);
    document.getElementById("day-count").textContent = `${list.length} 件`;

    const container = document.getElementById("day-records");
    container.innerHTML = "";

    if (list.length === 0) {
      container.innerHTML = '<div class="empty">この日の支出はありません。</div>';
      return;
    }

    list.sort((a, b) =>
      safeText(a.item).localeCompare(safeText(b.item), "ja")
    );

    list.forEach(record => {
      const article = document.createElement("div");
      article.className = "record";

      const top = document.createElement("div");
      top.className = "record-top";

      const name = document.createElement("div");
      name.className = "record-name";
      name.textContent = safeText(record.item) || "（項目なし）";

      const amount = document.createElement("div");
      amount.className = "record-amount";
      amount.textContent = yen(Number(record.amount) || 0);

      top.append(name, amount);
      article.appendChild(top);

      const meta = document.createElement("div");
      meta.className = "record-meta";
      meta.textContent = safeText(record.category) || "カテゴリー未設定";
      article.appendChild(meta);

      if (record.memo) {
        const memo = document.createElement("div");
        memo.className = "record-memo";
        memo.textContent = `メモ：${safeText(record.memo)}`;
        article.appendChild(memo);
      }

      container.appendChild(article);
    });
  }

  function render() {
    renderStats();
    renderCalendar();
    renderSelectedDay();
  }

  document.getElementById("prev-month").addEventListener("click", () => {
    selectedMonth = new Date(
      selectedMonth.getFullYear(),
      selectedMonth.getMonth() - 1,
      1
    );

    const lastDay = new Date(
      selectedMonth.getFullYear(),
      selectedMonth.getMonth() + 1,
      0
    ).getDate();

    const selectedDate = new Date(`${selectedDay}T12:00:00`);
    selectedDay = dateKey(new Date(
      selectedMonth.getFullYear(),
      selectedMonth.getMonth(),
      Math.min(selectedDate.getDate(), lastDay)
    ));
    render();
  });

  document.getElementById("next-month").addEventListener("click", () => {
    selectedMonth = new Date(
      selectedMonth.getFullYear(),
      selectedMonth.getMonth() + 1,
      1
    );

    const selectedDate = new Date(`${selectedDay}T12:00:00`);
    const lastDay = new Date(
      selectedMonth.getFullYear(),
      selectedMonth.getMonth() + 1,
      0
    ).getDate();

    selectedDay = dateKey(new Date(
      selectedMonth.getFullYear(),
      selectedMonth.getMonth(),
      Math.min(selectedDate.getDate(), lastDay)
    ));
    render();
  });

  onAuthStateChanged(auth, async user => {
    if (!user) {
      window.location.replace("login.html");
      return;
    }

    statusBox.textContent = "家計簿データを読み込んでいます…";
    statusBox.classList.remove("error");

    try {
      const snapshot = await getDocs(collection(db, "records"));
      records = snapshot.docs.map(item => ({
        id: item.id,
        ...item.data()
      }));

      statusBox.hidden = true;
      appSection.hidden = false;
      render();
    } catch (error) {
      console.error("日別データ読み込みエラー:", error);
      statusBox.textContent =
        "データを読み込めませんでした。Firestoreのルールと接続状態を確認してください。";
      statusBox.classList.add("error");
    }
  });
</script>
</body>
</html>
