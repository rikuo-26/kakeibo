<h2>スマホかんたん入力</h2>
  <div id="login-area">
  <h3>ログイン</h3>

  <input type="email" id="login-email" placeholder="メールアドレス">
  <br><br>

  <input type="password" id="login-password" placeholder="パスワード">
  <br><br>

  <button id="login-button">ログイン</button>

  <p id="login-message"></p>
</div>
<a href="monthly.html">月別集計ページへ</a>

<hr>

<h2>収入入力</h2>

<label>陸翔の収入</label>
<input type="number" id="income_rikuto" placeholder="例：250000">

<label>楓の収入</label>
<input type="number" id="income_kaede" placeholder="例：180000">

<button onclick="saveIncome()">収入を保存する</button>

<script>
 let income = {
  rikuto: 0,
  kaede: 0
};

 async function saveIncome() {
   if (!window.firebaseAuth.currentUser) {
  alert("先にログインしてください。");
  return;
}
    income.rikuto = Number(document.getElementById("income_rikuto").value);
    income.kaede = Number(document.getElementById("income_kaede").value);
   await window.firebaseSetDoc(
  window.firebaseDoc(window.firebaseDB, "settings", "income"),
  income
); 
    alert("収入を保存しました！");
    renderSummary();
  }

  // 画面読み込み時に反映
  document.getElementById("income_rikuto").value = income.rikuto;
  document.getElementById("income_kaede").value = income.kaede;
</script>

<label>日付</label>
<input type="date" id="date">

<label>分類</label>
<select id="category">
  <option value="固定費">固定費</option>
  <option value="生活必需費">生活必需費</option>
  <option value="自由費">自由費</option>
</select>

<label>項目</label>
<input type="text" id="item" placeholder="例：食費、電気、外食など">

<label>金額</label>
<input type="number" id="amount" placeholder="金額を入力">

<label>メモ</label>
<textarea id="memo" placeholder="任意"></textarea>

<button onclick="addRecord()">追加する</button>

<hr>

<h2>日々の支出一覧</h2>
<div id="list"></div>
<hr>

<h2>月間家計簿（支出集計）</h2>
<div id="summary"></div>

<script>
  async function loadRecords() {
    if (!window.firebaseAuth.currentUser) {
  return;
}
  const snapshot = await window.firebaseGetDocs(
  window.firebaseCollection(window.firebaseDB, "records")
);

  records = [];

  snapshot.forEach((doc) => {
    records.push({
      id: doc.id,
      ...doc.data()
    });
  });

  render();
  renderSummary();
}
async function loadIncome() {
  const snapshot = await window.firebaseGetDoc(
    window.firebaseDoc(window.firebaseDB, "settings", "income")
  );

  if (snapshot.exists()) {
    income = snapshot.data();

    document.getElementById("income_rikuto").value = income.rikuto;
    document.getElementById("income_kaede").value = income.kaede;

    renderSummary();
  }
}  
 
  
  function renderSummary() {
    let fixed = 0
    let essential = 0;
    let free = 0;

    records.forEach(r => {
      if (r.category === "固定費") fixed += r.amount;
      if (r.category === "生活必需費") essential += r.amount;
      if (r.category === "自由費") free += r.amount;
    });

    const total = fixed + essential + free;
 document.getElementById("summary").innerHTML = `
  固定費合計：${fixed} 円<br>
  生活必需費合計：${essential} 円<br>
  自由費合計：${free} 円<br>
  支出合計：${total} 円<br><br>
  収入合計：${income.rikuto + income.kaede} 円<br>
  残高（収入 − 支出）：${(income.rikuto + income.kaede) - total} 円
`;

 
    }

  // 既存の render() の最後に追加
  const oldRender = render;
  render = function() {
    oldRender();
    renderSummary();
  };

  renderSummary();
</script>

<script>
  // 今日の日付を自動セット
  document.getElementById("date").value = new Date().toISOString().slice(0,10);

  // ローカル保存から読み込み
let records = [];
let editingRecordId = null;  
async function addRecord() {
  if (!window.firebaseAuth.currentUser) {
  alert("先にログインしてください。");
  return;
}
  const isEditing = editingRecordId !== null;
  const r = {
    date: document.getElementById("date").value,
    category: document.getElementById("category").value,
    item: document.getElementById("item").value,
    amount: Number(document.getElementById("amount").value),
    memo: document.getElementById("memo").value
  };

  try {
    
if (isEditing) {
  await window.firebaseSetDoc(
    window.firebaseDoc(window.firebaseDB, "records", editingRecordId),
    r
  );

  r.id = editingRecordId;
  records.push(r);
} else {
  const docRef = await window.firebaseAddDoc(
    window.firebaseCollection(window.firebaseDB, "records"),
    r
  );

  r.id = docRef.id;
  records.push(r);
}

    render();
    editingRecordId = null;
    document.getElementById("item").value = ""; 
    document.getElementById("amount").value = "";
    document.getElementById("memo").value = "";
    document.getElementById("date").value = new Date().toISOString().slice(0,10);
    document.getElementById("category").value = "固定費";
    alert("Firebaseに保存しました！");
  } catch (error) {
    console.error(error);
    alert("Firebase保存エラー：" + error.message);
  }
}

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

 records.forEach((r, index) => {
    const div = document.createElement("div");
    div.className = "record";
    div.innerHTML = `
        <strong>${r.date}</strong><br>
        分類: ${r.category}<br>
        項目: ${r.item}<br>
        金額: ${r.amount} 円<br>
        メモ: ${r.memo}<br>
        <button onclick="editRecord(${index})">修正する</button>
        <button onclick="deleteRecord(${index})">削除する</button>
    `;
    list.appendChild(div);
});

     }
async function editRecord(i) {
    const r = records[i];
  editingRecordId = r.id;

    // 入力欄に値をセット
    document.getElementById("date").value = r.date;
    document.getElementById("category").value = r.category;
    document.getElementById("item").value = r.item;
    document.getElementById("amount").value = r.amount;
    document.getElementById("memo").value = r.memo;

    
   

    // 一覧更新
    render();
}
  async function deleteRecord(i) {
  const r = records[i];

  if (!confirm("この支出を削除しますか？")) {
    return;
  }

  try {
    await window.firebaseDeleteDoc(
      window.firebaseDoc(window.firebaseDB, "records", r.id)
    );

    records.splice(i, 1);
    render();
    renderSummary();

    alert("削除しました！");
  } catch (error) {
    console.error(error);
    alert("削除エラー：" + error.message);
  }
}

  render();
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { getFirestore, collection, getDocs, getDoc, addDoc, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

  const db = getFirestore(app);

  window.firebaseAuth = auth;
  window.firebaseDB = db;
  window.firebaseAddDoc = addDoc;
  window.firebaseCollection = collection;
  window.firebaseGetDocs = getDocs;
  window.firebaseDeleteDoc = deleteDoc;
  window.firebaseDoc = doc;
  window.firebaseSetDoc = setDoc;
  window.firebaseGetDoc = getDoc;

  loadRecords();
  loadIncome();
</script>
  <script type="module">
import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

  const auth = getAuth();
    
   onAuthStateChanged(auth, (user) => {
  if (user) {
    loadRecords();
    loadIncome();
  }
});

  document.getElementById("login-button").addEventListener("click", async () => {
    const email = document.getElementById("login-email").value;
    const password = document.getElementById("login-password").value;
    const message = document.getElementById("login-message");

    try {
      await setPersistence(auth, browserLocalPersistence);
      await signInWithEmailAndPassword(auth, email, password);
      message.textContent = "ログインしました！";
    } catch (error) {
      message.textContent = "メールアドレスまたはパスワードが違います。";
    }
  });
</script>
