
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入力｜ふたりの暮らし</title>

<style>
:root {
  --green: #557b63;
  --dark: #355640;
  --light: #e6eee5;
  --ivory: #faf8f0;
  --white: #fff;
  --text: #34443a;
  --muted: #748176;
  --border: #dce4d9;
  --red: #a45f48;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px 20px 110px;
  background: var(--ivory);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Noto Sans JP", sans-serif;
}

main {
  max-width: 900px;
  margin: 0 auto;
}

header { margin-bottom: 22px; }

h1 {
  margin: 0 0 8px;
  color: var(--dark);
  font-size: 27px;
}

h2 {
  margin: 0 0 16px;
  color: var(--dark);
  font-size: 19px;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
}

.panel {
  margin-bottom: 18px;
  padding: 20px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 3px 12px #354b3508;
}

label {
  display: block;
  margin: 14px 0 6px;
  font-size: 14px;
  font-weight: 700;
  color: var(--dark);
}

input, select, textarea {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 12px;
  margin: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fffefa;
  color: var(--text);
  font: inherit;
  font-size: 16px;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

button {
  padding: 12px 16px;
  border: 0;
  border-radius: 10px;
  background: var(--green);
  color: white;
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.primary-button {
  width: 100%;
  margin-top: 18px;
}

.secondary-button {
  background: var(--light);
  color: var(--dark);
}

.danger-button {
  background: #f7e8e3;
  color: #8a382a;
}

.income-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.income-total {
  margin-top: 16px;
  padding: 15px;
  border-radius: 12px;
  background: var(--light);
}

.income-total span {
  display: block;
  color: var(--muted);
  font-size: 13px;
}

.income-total strong {
  display: block;
  margin-top: 5px;
  color: var(--dark);
  font-size: 23px;
  overflow-wrap: anywhere;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.stat {
  min-width: 0;
  padding: 15px;
  border-radius: 12px;
  background: var(--ivory);
}

.stat-label {
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 13px;
}

.stat-value {
  color: var(--dark);
  font-size: clamp(17px, 3vw, 23px);
  font-weight: 700;
  overflow-wrap: anywhere;
}

.stat-value.negative { color: var(--red); }

.category-summary {
  display: grid;
  gap: 10px;
  margin-top: 14px;
}

.category-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}

.category-row strong {
  text-align: right;
  overflow-wrap: anywhere;
}

.status {
  margin-bottom: 18px;
  padding: 13px;
  border-radius: 10px;
  background: var(--light);
  color: var(--dark);
  font-size: 14px;
}

.status.error {
  background: #f9e8e4;
  color: #8a3024;
}

.date-group {
  margin-bottom: 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--white);
  overflow: hidden;
}

.date-group summary {
  padding: 15px 12px;
  background: var(--light);
  color: var(--dark);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  overflow-wrap: anywhere;
}

.date-group-content { padding: 0 13px; }

.record {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}

.record:last-child { border-bottom: 0; }

.record-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.record-name {
  font-weight: 700;
  overflow-wrap: anywhere;
}

.record-amount {
  flex-shrink: 0;
  color: var(--red);
  font-weight: 700;
  overflow-wrap: anywhere;
}

.record-meta {
  margin-top: 6px;
  color: var(--muted);
  font-size: 12px;
}

.record-memo {
  margin-top: 6px;
  font-size: 13px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.record-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.record-actions button {
  width: auto;
  padding: 8px 12px;
  font-size: 13px;
}

.empty {
  padding: 22px 12px;
  text-align: center;
  color: var(--muted);
  background: var(--ivory);
  border-radius: 10px;
  font-size: 14px;
}

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1000;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 0;
  margin: 0;
  padding: 9px 6px calc(9px + env(safe-area-inset-bottom));
  background: var(--white);
  border-top: 1px solid var(--border);
  box-shadow: 0 -3px 14px #354b3510;
}

.bottom-nav a {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 0;
  padding: 4px 0;
  border-radius: 10px;
  color: var(--muted);
  text-decoration: none;
  font-size: 11px;
  line-height: 1.4;
}

.nav-icon { font-size: 20px; }

.bottom-nav a.active {
  color: var(--dark);
  font-weight: bold;
}

.bottom-nav a.active .nav-icon {
  padding: 2px 12px;
  border-radius: 12px;
  background: var(--light);
}

@media (max-width: 600px) {
  body { padding: 12px 12px 110px; }
  h1 { font-size: 24px; }
  .panel { padding: 15px; }
  .income-grid { grid-template-columns: 1fr; gap: 4px; }
  .summary-grid { grid-template-columns: 1fr; }
  .record-top { gap: 8px; }
  .date-group summary { line-height: 1.7; }
}

/* 削除確認モーダル */
.modal-overlay[hidden] {
  display: none !important;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(35, 52, 40, 0.48);
  box-sizing: border-box;
}

.modal-card {
  width: 100%;
  max-width: 360px;
  box-sizing: border-box;
  padding: 28px 22px 22px;
  border: 1px solid #dce4d9;
  border-radius: 22px;
  background: #faf8f0;
  color: #34443a;
  text-align: center;
  box-shadow: 0 18px 50px rgba(30, 50, 35, 0.22);
  animation: modal-appear 0.18s ease-out;
}

.modal-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 58px;
  height: 58px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: #e6eee5;
  font-size: 28px;
}

.modal-card h2 {
  margin: 0 0 10px;
  font-size: 20px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.modal-card p {
  margin: 0 0 24px;
  color: #748176;
  font-size: 14px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.modal-actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
}

.modal-actions button {
  min-width: 0;
  min-height: 46px;
  box-sizing: border-box;
  padding: 10px;
  border: 0;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.5;
  white-space: normal;
  overflow-wrap: anywhere;
  cursor: pointer;
}

.modal-cancel {
  background: #e6eee5;
  color: #355640;
}

.modal-delete {
  background: #a45f48;
  color: #ffffff;
}

.modal-actions button:focus-visible {
  outline: 3px solid #557b63;
  outline-offset: 3px;
}

@keyframes modal-appear {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  .modal-card {
    animation: none;
  }
}

</style>
  
</head>

<body>
<main>
  <header>
    <h1>ふたりの暮らし 🌿</h1>
    <div class="subtitle">毎日の収入と支出を、ふたりで管理</div>
  </header>

  <div id="status" class="status">ログイン状態を確認しています…</div>

  <div id="app" hidden>
    <section class="panel">
      <h2>収入入力</h2>
      
            <label for="income-month">収入の対象月</label>
      <input type="month" id="income-month" required>
      
　　　　<div class="income-grid">
        <div>
          <label for="income_rikuto">陸翔の収入</label>
          <input type="number" id="income_rikuto"
            min="0" step="1" placeholder="例：250000">
        </div>
        <div>
          <label for="income_kaede">楓の収入</label>
          <input type="number" id="income_kaede"
            min="0" step="1" placeholder="例：180000">
        </div>
      </div>

      <button id="save-income-button" class="primary-button" type="button">
        収入を保存する
      </button>

      <div class="income-total">
        <span>ふたりの収入合計</span>
        <strong id="income-total">0 円</strong>
      </div>
    </section>

    <section class="panel">
      <h2 id="form-heading">支出を入力</h2>

      <label for="date">日付</label>
      <input type="date" id="date" required>

      <label for="category">分類</label>
      <select id="category"></select>
      
      <label for="item">項目</label>
      <input type="text" id="item" maxlength="100"
        placeholder="例：食費、電気、外食など">

      <label for="amount">金額（円）</label>
      <input type="number" id="amount" min="1" step="1"
        placeholder="金額を入力">

      <label for="memo">メモ（任意）</label>
      <textarea id="memo" maxlength="1000" placeholder="メモを入力"></textarea>

      <button id="add-button" class="primary-button" type="button">
        支出を追加する
      </button>
      <button id="cancel-edit-button" class="secondary-button"
        type="button" hidden>
        修正をキャンセル
      </button>
    </section>

    <section class="panel">
      <h2>支出の集計</h2>

      <div class="summary-grid">
        <div class="stat">
          <div class="stat-label">支出合計</div>
          <div class="stat-value" id="expense-total">0 円</div>
        </div>
        <div class="stat">
          <div class="stat-label">残高（収入 − 支出）</div>
          <div class="stat-value" id="balance">0 円</div>
        </div>
      </div>

<div class="category-summary" id="category-summary"></div>

      <p class="subtitle">集計は登録済みの全支出を対象にしています。</p>
    </section>

    <section class="panel">
      <h2>日々の支出一覧</h2>
      <p class="subtitle">日付ごとに折りたたんで確認できます。</p>
      <div id="list"></div>
    </section>
  </div>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <a href="index.html" class="active" aria-current="page">
      <span class="nav-icon">✚</span>
      <span>入力</span>
    </a>
    <a href="monthly.html">
      <span class="nav-icon">▦</span>
      <span>月別</span>
    </a>
    <a href="weekly.html">
      <span class="nav-icon">▤</span>
      <span>週次</span>
    </a>
    <a href="daily.html">
      <span class="nav-icon">▣</span>
      <span>日別</span>
    </a>
    <a href="settings.html">
      <span class="nav-icon">⚙</span>
      <span>設定</span>
    </a>
  </nav>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  addDoc,
  deleteDoc,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCm2ZekCOLi-JceUCcdDW5FyCdtSwh_ZJU",
  authDomain: "kakeibo-94245.firebaseapp.com",
  projectId: "kakeibo-94245",
  storageBucket: "kakeibo-94245.firebasestorage.app",
  messagingSenderId: "543784840442",
  appId: "1:543784840442:web:ff3fc3d96d417590952d43"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const $ = id => document.getElementById(id);

const statusBox = $("status");
const appSection = $("app");
const listElement = $("list");

let records = [];
let income = { rikuto: 0, kaede: 0 };
let categories = ["固定費", "生活必需費", "自由費"];
let editingRecordId = null;
let currentUser = null;
let saving = false;

function localDateString(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function yen(value) {
  const number = Number(value);
  return `${Math.round(Number.isFinite(number) ? number : 0).toLocaleString("ja-JP")} 円`;
}

function safeNumber(value) {
  const number = Number(value);
  return Number.isFinite(number) ? number : 0;
}

function showStatus(message, isError = false) {
  statusBox.textContent = message;
  statusBox.classList.toggle("error", isError);
  statusBox.hidden = false;
}

function requireLogin() {
  if (currentUser) return true;
  alert("ログインしてください。");
  window.location.replace("login.html");
  return false;
}

function setSaving(value) {
  saving = value;
  $("save-income-button").disabled = value;
  $("add-button").disabled = value;
}


function renderSummary() {
  const categoryTotals = new Map();

  for (const category of categories) {
    categoryTotals.set(category, 0);
  }

  let total = 0;

  for (const record of records) {
    const amount = safeNumber(record.amount);
    total += amount;

    const category =
      typeof record.category === "string" && record.category.trim()
        ? record.category
        : "カテゴリー未設定";

    categoryTotals.set(
      category,
      (categoryTotals.get(category) || 0) + amount
    );
  }

  const incomeTotal =
    safeNumber(income.rikuto) + safeNumber(income.kaede);
  const balance = incomeTotal - total;

  $("income-total").textContent = yen(incomeTotal);
  $("expense-total").textContent = yen(total);
  $("balance").textContent = yen(balance);
  $("balance").classList.toggle("negative", balance < 0);

  const summary = $("category-summary");
  summary.replaceChildren();

  for (const [category, amount] of categoryTotals) {
    const row = makeElement("div", "category-row");
    const name = makeElement("span", "", category);
    const value = makeElement("strong", "", yen(amount));

    row.append(name, value);
    summary.appendChild(row);
  }
}


function makeElement(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function render() {
  listElement.replaceChildren();

  const sortedRecords = [...records].sort((a, b) => {
    const dateOrder = String(b.date || "").localeCompare(String(a.date || ""));
    if (dateOrder !== 0) return dateOrder;
    return String(a.item || "").localeCompare(String(b.item || ""), "ja");
  });

  if (sortedRecords.length === 0) {
    listElement.appendChild(
      makeElement("div", "empty", "まだ支出がありません。最初の支出を追加してみましょう 🌿")
    );
    renderSummary();
    return;
  }

  let currentDate = null;
  let groupContent = null;

  for (const record of sortedRecords) {
    if (record.date !== currentDate) {
      currentDate = record.date;

      const dateRecords = sortedRecords.filter(item => item.date === currentDate);
      const dayTotal = dateRecords.reduce(
        (sum, item) => sum + safeNumber(item.amount), 0
      );

      const details = document.createElement("details");
      details.className = "date-group";
      details.open = currentDate === localDateString();

      const summary = document.createElement("summary");
      summary.textContent =
        `📅 ${currentDate || "日付なし"}　${dateRecords.length}件　合計 ${yen(dayTotal)}`;

      groupContent = makeElement("div", "date-group-content");
      details.append(summary, groupContent);
      listElement.appendChild(details);
    }

    const article = makeElement("article", "record");
    const top = makeElement("div", "record-top");
    const name = makeElement("div", "record-name", record.item || "（項目なし）");
    const amount = makeElement("div", "record-amount", yen(record.amount));

    top.append(name, amount);
    article.appendChild(top);

    article.appendChild(
      makeElement("div", "record-meta", record.category || "カテゴリー未設定")
    );

    if (record.memo) {
      article.appendChild(
        makeElement("div", "record-memo", `メモ：${record.memo}`)
      );
    }

    const actions = makeElement("div", "record-actions");

    const editButton = makeElement("button", "secondary-button", "修正する");
    editButton.type = "button";
    editButton.addEventListener("click", () => editRecord(record.id));

    const deleteButton = makeElement("button", "danger-button", "削除する");
    deleteButton.type = "button";
    deleteButton.addEventListener("click", () => deleteRecord(record.id));

    actions.append(editButton, deleteButton);
    article.appendChild(actions);
    groupContent.appendChild(article);
  }

  renderSummary();
}

function clearExpenseForm() {
  editingRecordId = null;
  $("date").value = localDateString();
  $("category").value = "固定費";
  $("item").value = "";
  $("amount").value = "";
  $("memo").value = "";
  $("form-heading").textContent = "支出を入力";
  $("add-button").textContent = "支出を追加する";
  $("cancel-edit-button").hidden = true;
}

async function loadRecords() {
  const snapshot = await getDocs(collection(db, "records"));
  records = snapshot.docs.map(item => ({
    id: item.id,
    ...item.data()
  }));
}

async function loadIncome() {
  const month = $("income-month").value;

  if (!month) return;

  const monthlySnapshot = await getDoc(
    doc(db, "monthlyIncome", month)
  );

  if (monthlySnapshot.exists()) {
    const data = monthlySnapshot.data();

    income = {
      rikuto: safeNumber(data.rikuto),
      kaede: safeNumber(data.kaede)
    };
  } else {
    const now = new Date();
    const currentMonth =
      `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

    if (month === currentMonth) {
      const oldSnapshot = await getDoc(
        doc(db, "settings", "income")
      );

      if (oldSnapshot.exists()) {
        const data = oldSnapshot.data();

        income = {
          rikuto: safeNumber(data.rikuto),
          kaede: safeNumber(data.kaede)
        };
      } else {
        income = { rikuto: 0, kaede: 0 };
      }
    } else {
      income = { rikuto: 0, kaede: 0 };
    }
  }

  $("income_rikuto").value = income.rikuto || "";
  $("income_kaede").value = income.kaede || "";
}
async function loadCategories() {
  const snapshot = await getDoc(doc(db, "settings", "categories"));

  if (snapshot.exists()) {
    const data = snapshot.data();

    if (Array.isArray(data.categories)) {
      categories = [
        ...new Set(
          data.categories
            .filter(
              item => typeof item === "string" && item.trim() !== ""
            )
            .map(item => item.trim())
        )
      ];
    }
  }

  renderCategoryOptions();
}

function renderCategoryOptions(selectedValue) {
  const select = $("category");
  const previousValue = selectedValue ?? select.value;

  select.replaceChildren();

  const availableCategories = [...categories];

  for (const record of records) {
    const oldCategory = record.category;

    if (
      typeof oldCategory === "string" &&
      oldCategory.trim() &&
      !availableCategories.includes(oldCategory)
    ) {
      availableCategories.push(oldCategory);
    }
  }

  if (
    records.some(
      record => !record.category || !String(record.category).trim()
    ) &&
    !availableCategories.includes("カテゴリー未設定")
  ) {
    availableCategories.push("カテゴリー未設定");
  }

  for (const category of availableCategories) {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    select.appendChild(option);
  }

  if (availableCategories.includes(previousValue)) {
    select.value = previousValue;
  } else if (availableCategories.length > 0) {
    select.value = availableCategories[0];
  }
}  


async function saveIncome() {
  if (!requireLogin() || saving) return;

  const month = $("income-month").value;
  const rikutoText = $("income_rikuto").value;
  const kaedeText = $("income_kaede").value;

  if (!month) {
    alert("収入の対象月を選択してください。");
    return;
  }

  if (rikutoText === "" || kaedeText === "") {
    alert("ふたりの収入を入力してください。");
    return;
  }

  const rikuto = Number(rikutoText);
  const kaede = Number(kaedeText);

  if (
    !Number.isFinite(rikuto) || rikuto < 0 ||
    !Number.isFinite(kaede) || kaede < 0
  ) {
    alert("収入は0以上の数字で入力してください。");
    return;
  }

  setSaving(true);

  try {
    const newIncome = { rikuto, kaede };

    await setDoc(
      doc(db, "monthlyIncome", month),
      newIncome
    );

    income = newIncome;
    renderSummary();

    showNotice(
      "収入を保存しました！",
      `${month}のふたりの収入を保存しました。`
    );
  } catch (error) {
    console.error("収入保存エラー:", error);
    alert("収入の保存に失敗しました：" + error.message);
  } finally {
    setSaving(false);
  }
}


async function addRecord() {
  if (!requireLogin() || saving) return;

  const date = $("date").value;
  const category = $("category").value;
  const item = $("item").value.trim();
  const amountText = $("amount").value;
  const amount = Number(amountText);
  const memo = $("memo").value.trim();

  if (!date) {
    alert("日付を選択してください。");
    return;
  }

  if (!item) {
    alert("項目を入力してください。");
    $("item").focus();
    return;
  }

  if (
    amountText === "" ||
    !Number.isFinite(amount) ||
    amount <= 0
  ) {
    alert("金額は1円以上で入力してください。");
    $("amount").focus();
    return;
  }

  const recordData = { date, category, item, amount, memo };
  const isEditing = editingRecordId !== null;
  setSaving(true);

  try {
    if (isEditing) {
      const id = editingRecordId;
      await setDoc(doc(db, "records", id), recordData);

      records = records.map(record =>
        record.id === id ? { id, ...recordData } : record
      );
    } else {
      const docRef = await addDoc(collection(db, "records"), recordData);
      records.push({ id: docRef.id, ...recordData });
    }

    clearExpenseForm();
    render();
    showNotice(
  isEditing ? "更新しました！" : "追加しました！",
  isEditing ? "支出の内容を更新しました。" : "支出を一覧に追加しました。"
);
  } catch (error) {
    console.error("支出保存エラー:", error);
    alert("保存に失敗しました：" + error.message);
  } finally {
    setSaving(false);
  }
}

function editRecord(id) {
  if (!requireLogin()) return;

  const record = records.find(item => item.id === id);
  if (!record) {
    alert("対象の支出が見つかりません。");
    return;
  }

  editingRecordId = id;
  $("date").value = record.date || localDateString();
  renderCategoryOptions(record.category || "固定費");
  $("category").value = record.category || "固定費";
  $("item").value = record.item || "";
  $("amount").value = record.amount ?? "";
  $("memo").value = record.memo || "";
  $("form-heading").textContent = "支出を修正";
  $("add-button").textContent = "修正を保存する";
  $("cancel-edit-button").hidden = false;

  $("form-heading").scrollIntoView({ behavior: "smooth", block: "start" });
}


function confirmDeleteRecord(record) {
  const modal = $("delete-modal");
  const message = $("delete-modal-message");
  const cancelButton = $("delete-cancel-button");
  const confirmButton = $("delete-confirm-button");

  if (!modal || !message || !cancelButton || !confirmButton) {
    return Promise.resolve(
      window.confirm(
        `「${record.item || "項目なし"}」 ${yen(record.amount)} を削除しますか？`
      )
    );
  }

  message.textContent =
    `「${record.item || "項目なし"}」 ${yen(record.amount)} を削除します。この操作は取り消せません。`;

  modal.hidden = false;

  return new Promise(resolve => {
    function finish(result) {
      modal.hidden = true;
      cancelButton.removeEventListener("click", onCancel);
      confirmButton.removeEventListener("click", onConfirm);
      modal.removeEventListener("click", onBackdrop);
      document.removeEventListener("keydown", onKeydown);
      resolve(result);
    }

    function onCancel() {
      finish(false);
    }

    function onConfirm() {
      finish(true);
    }

    function onBackdrop(event) {
      if (event.target === modal) finish(false);
    }

    function onKeydown(event) {
      if (event.key === "Escape") finish(false);
    }

    cancelButton.addEventListener("click", onCancel);
    confirmButton.addEventListener("click", onConfirm);
    modal.addEventListener("click", onBackdrop);
    document.addEventListener("keydown", onKeydown);

    cancelButton.focus();
  });
}

async function deleteRecord(id) {
  if (!requireLogin() || saving) return;

  const record = records.find(item => item.id === id);

  if (!record) {
    alert("対象の支出が見つかりません。");
    return;
  }

  const confirmed = await confirmDeleteRecord(record);
  if (!confirmed) return;

  setSaving(true);

  try {
    await deleteDoc(doc(db, "records", id));
    records = records.filter(item => item.id !== id);

    if (editingRecordId === id) clearExpenseForm();

    render();
    showNotice("削除しました！", "支出一覧を更新しました。");
  } catch (error) {
    console.error("支出削除エラー:", error);
    alert("削除に失敗しました：" + error.message);
  } finally {
    setSaving(false);
  }
}

$("income-month").addEventListener("change", async () => {

});
$("add-button").addEventListener("click", addRecord);
$("cancel-edit-button").addEventListener("click", clearExpenseForm);

});

$("date").value = localDateString();

  const today = new Date();
$("income-month").value =
  `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;

onAuthStateChanged(auth, async user => {

try {

  ]);

  } catch (error) {

      true
    );

function showNotice(title, message) {
  const modal = $("notice-modal");
  const titleElement = $("notice-modal-title");
  const messageElement = $("notice-modal-message");
  const closeButton = $("notice-close-button");

  if (!modal || !titleElement || !messageElement || !closeButton) {
    alert(message);
    return;
  }

  titleElement.textContent = title;
  messageElement.textContent = message;
  modal.hidden = false;

  function closeNotice() {
    modal.hidden = true;
    closeButton.removeEventListener("click", closeNotice);
    modal.removeEventListener("click", closeBackdrop);
    document.removeEventListener("keydown", closeEscape);
  }

  function closeBackdrop(event) {
    if (event.target === modal) closeNotice();
  }

  function closeEscape(event) {
    if (event.key === "Escape") closeNotice();
  }

  closeButton.addEventListener("click", closeNotice);
  modal.addEventListener("click", closeBackdrop);
  document.addEventListener("keydown", closeEscape);

  closeButton.focus();
}
